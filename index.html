<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaqhil Hussain</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><style>path{fill:%23111113;}@media(prefers-color-scheme:dark){path{fill:%23f0ebe1;}}</style><path d='M12 2L2 22l10-4 10 4L12 2zm0 4.5l6.5 13.5-6.5-2.5-6.5 2.5L12 6.5z'/></svg>">
<meta name="description" content="Network engineer by profession, student of reality by obsession.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0b0d12;
  --hairline: #222530;
  --hairline-soft: #1a1d25;
  --text: #f0ebe1;
  --text-secondary: #b8b2a5;
  --text-muted: #8a8478;
  --text-dim: #5a564d;
  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
}

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 17px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-weight: 400;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-image:
    radial-gradient(ellipse 100% 60% at 50% 0%, rgba(240, 235, 225, 0.025), transparent 70%),
    radial-gradient(ellipse 80% 50% at 50% 100%, rgba(240, 235, 225, 0.015), transparent 60%);
}

::selection {
  background: rgba(240, 235, 225, 0.15);
  color: var(--text);
}

/* ============================================================
   Main hero
============================================================ */
.landing {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 80px 28px 40px;
}

.landing-inner {
  max-width: 720px;
  width: 100%;
}

.name {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 500;
  font-size: clamp(44px, 7vw, 72px);
  line-height: 1.1;
  letter-spacing: -0.015em;
  color: var(--text);
  margin-bottom: 40px;
  opacity: 0;
  animation: fadeUp 1.2s ease 0.2s forwards;
}

.tagline {
  font-family: var(--serif);
  font-size: clamp(19px, 2.4vw, 24px);
  line-height: 1.55;
  letter-spacing: -0.005em;
  color: var(--text-secondary);
  max-width: 620px;
  margin: 0 auto 72px;
  opacity: 0;
  animation: fadeUp 1.4s ease 0.5s forwards;
}

.tagline em {
  color: var(--text);
  font-style: italic;
}

/* ============================================================
   Doors (the menu of sub-sites)
============================================================ */
.doors {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  opacity: 0;
  animation: fadeUp 1.4s ease 0.9s forwards;
}

.door {
  font-family: var(--serif);
  font-size: clamp(22px, 3vw, 28px);
  font-weight: 500;
  color: var(--text);
  text-decoration: none;
  padding: 12px 4px;
  display: inline-block;
  position: relative;
  letter-spacing: -0.005em;
  transition: color 0.25s ease, letter-spacing 0.25s ease;
}

.door::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: 6px;
  width: 0;
  height: 1px;
  background: var(--text-secondary);
  transition: width 0.3s ease, left 0.3s ease;
}

.door:hover {
  color: #ffffff;
  letter-spacing: 0.015em;
}

.door:hover::after {
  width: 60%;
  left: 20%;
}

.door:focus-visible {
  outline: none;
}

.door:focus-visible::after {
  width: 60%;
  left: 20%;
}

/* ============================================================
   Footer
============================================================ */
footer {
  padding: 28px 28px 32px;
  text-align: center;
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-dim);
  opacity: 0;
  animation: fadeIn 2s ease 1.4s forwards;
}

/* ============================================================
   Animations
============================================================ */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ============================================================
   Mobile
============================================================ */
@media (max-width: 640px) {
  .landing { padding: 60px 22px 32px; }
  .name { margin-bottom: 30px; }
  .tagline { margin-bottom: 56px; }
  .doors { gap: 2px; }
  .door { padding: 10px 4px; }
  footer { font-size: 10px; padding: 24px 22px 28px; }
}

@media (max-height: 640px) {
  .landing { padding-top: 40px; padding-bottom: 24px; }
  .name { margin-bottom: 20px; }
  .tagline { margin-bottom: 36px; }
}
</style>
</head>
<body>

<main class="landing">
  <div class="landing-inner">
    <h1 class="name">Aaqhil Hussain</h1>
    <p class="tagline">Network engineer by profession, student of reality by obsession. This is where I keep the questions that refuse to become background noise.</p>

    <nav class="doors" aria-label="Sections">
      <a class="door" href="/science/">Science</a>
      <a class="door" href="/aviation/">Aviation</a>
      <a class="door" href="/networking/">Networking</a>
    </nav>
  </div>
</main>

<footer>
  &copy; 2026 &middot; Aaqhil Hussain
</footer>

</body>
</html>
