<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aaqhil Hussain</title>
  <meta name="description" content="Personal website of Aaqhil Hussain.">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: #f4f4f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 700px;
      padding: 40px 24px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    p {
      font-size: 1.2rem;
      color: #c7c7c7;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    a {
      color: #f4f4f4;
      text-decoration: none;
      border: 1px solid #444;
      padding: 14px 22px;
      border-radius: 999px;
      transition: 0.2s ease;
    }

    a:hover {
      background: #f4f4f4;
      color: #0f1115;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Aaqhil Hussain</h1>

    <p>
      A personal corner of the internet for the things I keep coming back to:
      science, networking, systems, and ideas worth thinking about properly.
    </p>

    <div class="links">
      <a href="/science/">Science</a>
      <a href="/networking/">Networking</a>
    </div>
  </main>
</body>
</html>
